<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARD Audiothek RSS Mapper | Error</title>
    <style>
        :root {
            color-scheme: light;
            --bg-gradient: linear-gradient(135deg, #001a4d, #00357a, #0b6cff);
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.25);
            --accent: #ffca28;
            --text-primary: #f4f6fb;
            --text-muted: #b9c3e6;
            --input-bg: rgba(255, 255, 255, 0.15);
            --font-sans: "Segoe UI", "Helvetica Neue", "Liberation Sans", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: var(--font-sans);
            background: var(--bg-gradient);
            color: var(--text-primary);
        }

        main {
            width: min(640px, 100%);
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 60px rgba(0, 14, 56, 0.4);
            animation: floatIn 500ms ease;
        }

        @keyframes floatIn {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: clamp(1.9rem, 3vw, 2.4rem);
        }

        p {
            margin-top: 0;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        label {
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--accent);
        }

        button {
            padding: 0.95rem 1.5rem;
            border: none;
            border-radius: 16px;
            background: var(--accent);
            color: #0c1a3c;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: transform 120ms ease, box-shadow 120ms ease;
        }

        button:active { transform: scale(0.98); }
        button:hover  { box-shadow: 0 10px 20px rgba(255, 202, 40, 0.35); }

        .status {
            margin-top: 1rem;
            min-height: 1.25rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .result-card {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(12, 26, 60, 0.6);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .result-card span {
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        @media (max-width: 540px) {
            body  { padding: 1.25rem; }
            main  { padding: 1.75rem; }
            button { width: 100%; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Our RSS rocket hit turbulence</h1>
        <p>The feed you requested tripped our parsing crew, so we had to abort the mission.</p>
        <div class="status">
            <span>Status {{.StatusCode}}</span>
        </div>
        <section class="result-card">
            <span>What you can do</span>
            <p>{{.Message}}</p>
            <button type="button" onclick="window.location='/'">Back to mapper</button>
        </section>
    </main>
</body>
</html>
