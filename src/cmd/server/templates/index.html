<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARD Audiothek RSS Mapper</title>
    <style>
        :root {
            color-scheme: light;
            --page-bg: #c9ced6;
            --panel-bg: #eceff3;
            --panel-border: #8a9099;
            --panel-shadow: #ffffff;
            --accent: #1f3f7a;
            --accent-soft: #d6dceb;
            --text-primary: #1c2128;
            --text-muted: #4d5968;
            --input-bg: #ffffff;
            --font-sans: "Segoe UI", "Helvetica Neue", "Liberation Sans", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: var(--font-sans);
            background: var(--page-bg);
            color: var(--text-primary);
        }

        main {
            width: min(640px, 100%);
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 4px;
            padding: 2.5rem;
            box-shadow: 2px 2px 0 var(--panel-shadow), 5px 5px 0 rgba(0, 0, 0, 0.18);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: clamp(1.9rem, 3vw, 2.4rem);
        }

        p {
            margin-top: 0;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.85rem;
        }

        .title-text {
            flex: 0 0 100%;
            width: 100%;
        }

        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem;
            border: 1px solid var(--panel-border);
            border-radius: 3px;
            background: #dde2ea;
        }

        .lang-switch button {
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 0.35rem 0.75rem;
            border-radius: 3px;
            cursor: pointer;
            transition: background 120ms ease, border-color 120ms ease;
        }

        .lang-switch button+button {
            margin-left: 0.4rem;
        }

        .lang-switch button.is-active {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: #11254d;
        }

        .lang-switch button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .hero-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 1.5rem;
            padding: 0.55rem 0.85rem;
            border-radius: 3px;
            border: 1px solid var(--panel-border);
            background: #e4e8ef;
            color: #1a2f58;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            transition: background 120ms ease;
        }

        .hero-link:hover {
            background: #d8dde6;
        }

        .form-row {
            display: flex;
            gap: 0.75rem;
            flex-direction: column;
            align-items: stretch;
        }

        label {
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #2b457c;
        }

        #audiothek-input {
            width: 100%;
            padding: 0.95rem 1.1rem;
            border-radius: 3px;
            border: 1px solid #9ba2ac;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 1rem;
            line-height: 1.4;
            min-height: 7.25rem;
            resize: vertical;
            transition: border-color 120ms ease;
            font-family: inherit;
        }

        #audiothek-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            padding: 0.95rem 1.5rem;
            border: 1px solid #153164;
            border-radius: 3px;
            background: var(--accent-soft);
            color: #142d59;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 120ms ease;
        }

        #map-button {
            align-self: flex-start;
        }

        button:active {
            background: #c7d0e3;
        }

        button:hover {
            background: #ccd5e8;
        }

        .status {
            margin-top: 1rem;
            min-height: 1.25rem;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .result-card {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 3px;
            border: 1px solid #9aa1ab;
            background: #f4f6f9;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            transition: opacity 200ms ease;
        }

        .result-card.is-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .result-card span {
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .result-card a {
            word-break: break-all;
            color: #204a93;
            font-size: 1rem;
            text-decoration: none;
        }

        .result-card a:hover {
            text-decoration: underline;
        }

        .examples {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            position: relative;
            border: 1px solid #9ba2ac;
            border-radius: 3px;
            padding: 1.1rem 0.75rem 0.7rem;
            background: #f1f4f8;
        }

        .examples button {
            background: #e4e8ef;
            color: #1c2128;
            text-transform: none;
            font-size: 0.85rem;
            letter-spacing: normal;
            padding: 0.5rem 0.75rem;
            border-color: #9ba2ac;
        }

        .examples-title {
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #2b457c;
            margin: 0;
            position: absolute;
            top: -0.55rem;
            left: 0.55rem;
            padding: 0 0.35rem;
            background: var(--panel-bg);
            line-height: 1;
        }

        @media (max-width: 540px) {
            body {
                padding: 1.25rem;
            }

            main {
                padding: 1.75rem;
            }

            button {
                width: 100%;
            }

            #map-button {
                align-self: stretch;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .lang-switch {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <main>
        <header class="page-header">
            <h1 id="title-text" class="title-text">ARD Audiothek RSS Mapper</h1>
            <div class="lang-switch" id="lang-switch" role="group" aria-label="Sprache wechseln">
                <button type="button" class="is-active" data-lang="de" aria-pressed="true">DE</button>
                <button type="button" data-lang="en" aria-pressed="false">EN</button>
            </div>
        </header>
        <a class="hero-link" id="hero-link" href="https://www.ardaudiothek.de/" target="_blank"
            rel="noopener noreferrer">
            Besuche die ARD AUDIOTHEK
        </a>
        <p id="description-text">Fuege die exakte Audiothek-Show-URL (inklusive https://) ein, um den passenden RSS-Feed
            dieses Services zu erhalten.</p>
        <label for="audiothek-input" id="input-label">Audiothek Show URL</label>
        <div class="form-row">
            <textarea id="audiothek-input" placeholder="Beispiel: https://www.ardaudiothek.de/sendung/..." rows="3"
                spellcheck="false"></textarea>
            <button type="button" id="map-button" aria-label="RSS-Link generieren">Feed erzeugen</button>
        </div>
        <div class="status" id="status">Fuege einen Wert ein und druecke Strg+Enter (Cmd+Enter auf macOS) zum Start.</div>
        <section class="result-card is-hidden" id="result" aria-live="polite">
            <span id="result-label">RSS-Feed</span>
            <a href="" target="_blank" id="result-link" rel="noopener noreferrer">Link kopieren</a>
        </section>
        <section class="examples">
            <p class="examples-title" id="examples-label">Beispiele</p>
            <button type="button" data-example="primary"
                data-sample="https://www.ardaudiothek.de/sendung/grosse-geschichten-ard-literatur-hoerspiele/urn:ard:show:de76181e5527c837/">
                Show-URL einsetzen
            </button>
            <button type="button" data-example="secondary"
                data-sample="https://www.ardaudiothek.de/sendung/professor-van-dusen/urn:ard:show:8103e24c954e0404/">
                Alternative URL
            </button>
        </section>
    </main>
    <script>
        (function () {
            const input = document.getElementById("audiothek-input");
            const mapButton = document.getElementById("map-button");
            const status = document.getElementById("status");
            const resultCard = document.getElementById("result");
            const resultLink = document.getElementById("result-link");
            const resultLabel = document.getElementById("result-label");
            const titleText = document.getElementById("title-text");
            const heroLink = document.getElementById("hero-link");
            const description = document.getElementById("description-text");
            const inputLabel = document.getElementById("input-label");
            const examplesLabel = document.getElementById("examples-label");
            const examplePrimaryBtn = document.querySelector(".examples button[data-example='primary']");
            const exampleSecondaryBtn = document.querySelector(".examples button[data-example='secondary']");
            const exampleButtons = document.querySelectorAll(".examples button[data-sample]");
            const langSwitch = document.getElementById("lang-switch");
            const langButtons = langSwitch.querySelectorAll("button[data-lang]");

            const translations = {
                de: {
                    title: "ARD Audiothek RSS Mapper",
                    heroLink: "Besuche die ARD AUDIOTHEK",
                    heroLinkAria: "Öffnet die ARD Audiothek in einem neuen Tab",
                    description: "Füge die exakte Audiothek-Show-URL (inklusive https://) ein, um den passenden RSS-Feed dieses Services zu erhalten.",
                    label: "Audiothek Show URL",
                    placeholder: "Beispiel: https://www.ardaudiothek.de/sendung/...",
                    mapButton: "Feed erzeugen",
                    mapButtonAria: "RSS-Link generieren",
                    resultLabel: "RSS-Feed",
                    resultLinkText: "Link kopieren",
                    langSwitchLabel: "Sprache wechseln",
                    examplesLabel: "Beispiele",
                    examplePrimary: "1. Beispiel",
                    exampleSecondary: "2. Beispiel",
                    status: {
                        idle: "Füge einen Wert ein und drücke Strg+Enter (Cmd+Enter auf macOS) zum Start.",
                        invalid: "Bitte eine gültige Audiothek-Show-URL einfügen.",
                        ready: "Link bereit. Klicke unten, um den RSS-Feed zu öffnen.",
                        copied: "Link kopiert – neues Tab geöffnet.",
                        copyFailed: "Konnte nicht kopieren – öffne nur den Link.",
                        clipboardMissing: "Zwischenspeicher nicht verfügbar – öffne Link."
                    }
                },
                en: {
                    title: "ARD Audiothek RSS Mapper",
                    heroLink: "Visit the ARD AUDIOTHEK",
                    heroLinkAria: "Opens ARD Audiothek in a new tab",
                    description: "Paste the exact Audiothek show URL (including https://) to generate the RSS feed provided by this service.",
                    label: "Audiothek show URL",
                    placeholder: "Example: https://www.ardaudiothek.de/sendung/...",
                    mapButton: "Create feed",
                    mapButtonAria: "Generate RSS link",
                    resultLabel: "RSS Feed",
                    resultLinkText: "Copy link",
                    langSwitchLabel: "Change language",
                    examplesLabel: "Examples",
                    examplePrimary: "1. Example",
                    exampleSecondary: "2. Example",
                    status: {
                        idle: "Paste a value and press Ctrl+Enter (Cmd+Enter on macOS) to start.",
                        invalid: "Please paste a valid Audiothek show URL.",
                        ready: "Link ready. Click below to open the RSS feed.",
                        copied: "Link copied – opened in a new tab.",
                        copyFailed: "Could not copy – opening the link only.",
                        clipboardMissing: "Clipboard unavailable – opening the link."
                    }
                }
            };

            const languageCookieName = "ui_lang";
            let statusKey = "idle";
            let currentLang = "de";

            function readCookie(name) {
                const entry = document.cookie
                    .split(";")
                    .map((part) => part.trim())
                    .find((part) => part.startsWith(`${name}=`));
                return entry ? decodeURIComponent(entry.split("=")[1]) : null;
            }

            function writeCookie(name, value) {
                document.cookie = `${name}=${encodeURIComponent(value)};path=/;max-age=31536000`;
            }

            function updateStatus(key) {
                statusKey = key;
                status.textContent = translations[currentLang].status[key];
            }

            function applyLanguage(lang) {
                if (!translations[lang]) {
                    lang = "de";
                }
                currentLang = lang;
                document.documentElement.lang = currentLang;
                const dict = translations[currentLang];

                titleText.textContent = dict.title;
                heroLink.textContent = dict.heroLink;
                heroLink.setAttribute("aria-label", dict.heroLinkAria);
                description.textContent = dict.description;
                inputLabel.textContent = dict.label;
                input.placeholder = dict.placeholder;
                mapButton.textContent = dict.mapButton;
                mapButton.setAttribute("aria-label", dict.mapButtonAria);
                resultLabel.textContent = dict.resultLabel;
                if (resultCard.classList.contains("is-hidden")) {
                    resultLink.textContent = dict.resultLinkText;
                    resultLink.removeAttribute("href");
                }
                examplesLabel.textContent = dict.examplesLabel;
                if (examplePrimaryBtn) {
                    examplePrimaryBtn.textContent = dict.examplePrimary;
                }
                if (exampleSecondaryBtn) {
                    exampleSecondaryBtn.textContent = dict.exampleSecondary;
                }
                langSwitch.setAttribute("aria-label", dict.langSwitchLabel);
                langButtons.forEach((button) => {
                    const isActive = button.dataset.lang === currentLang;
                    button.classList.toggle("is-active", isActive);
                    button.setAttribute("aria-pressed", isActive ? "true" : "false");
                });

                status.textContent = dict.status[statusKey];
            }

            function setLanguage(lang, { persist = true } = {}) {
                applyLanguage(lang);
                if (persist) {
                    writeCookie(languageCookieName, currentLang);
                }
            }

            function resolveInitialLanguage() {
                const cookieLang = readCookie(languageCookieName);
                if (cookieLang && translations[cookieLang]) {
                    return cookieLang;
                }
                const browserLang = (navigator.language || navigator.languages?.[0] || "").toLowerCase();
                return browserLang.startsWith("de") ? "de" : "en";
            }

            langButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    const lang = button.dataset.lang;
                    if (lang && lang !== currentLang) {
                        setLanguage(lang);
                    }
                });
            });

            // Base feed URL follows current host to avoid hard-coded origins.
            const baseUrl = `${window.location.origin}/rss/feed/`;

            function renderResult() {
                const rawValue = input.value.trim();
                if (!rawValue) {
                    resultCard.classList.add("is-hidden");
                    resultLink.removeAttribute("href");
                    resultLink.textContent = translations[currentLang].resultLinkText;
                    updateStatus("invalid");
                    return;
                }

                const encodedValue = encodeURIComponent(rawValue);
                const finalUrl = `${baseUrl}${encodedValue}`;

                resultLink.href = finalUrl;
                resultLink.textContent = finalUrl;
                resultCard.classList.remove("is-hidden");
                updateStatus("ready");
            }

            mapButton.addEventListener("click", renderResult);
            input.addEventListener("keydown", (event) => {
                if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
                    event.preventDefault();
                    renderResult();
                }
            });

            exampleButtons.forEach((button) => {
                button.addEventListener("click", () => {
                    input.value = button.dataset.sample || "";
                    renderResult();
                    input.focus();
                });
            });

            resultLink.addEventListener("click", (event) => {
                const targetUrl = resultLink.href;
                if (!targetUrl) {
                    return;
                }

                event.preventDefault();
                const onCopySuccess = () => {
                    updateStatus("copied");
                    window.open(targetUrl, "_blank", "noopener,noreferrer");
                };

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard
                        .writeText(targetUrl)
                        .then(onCopySuccess)
                        .catch(() => {
                            updateStatus("copyFailed");
                            window.open(targetUrl, "_blank", "noopener,noreferrer");
                        });
                } else {
                    updateStatus("clipboardMissing");
                    window.open(targetUrl, "_blank", "noopener,noreferrer");
                }
            });

            const initialLang = resolveInitialLanguage();
            setLanguage(initialLang, { persist: false });
            updateStatus("idle");
        })();
    </script>
</body>

</html>
