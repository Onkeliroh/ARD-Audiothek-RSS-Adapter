   <title>Jagd auf Fantomas | ARD Hörspiel-Serie · Neue Folgen - Jetzt Podcast anhören!</title>
   <meta name="description" content="Ganz Frankreich steht Kopf im Hörspiel - Adventskalender mit den Comedy All Stars Annette Frier, Christoph Maria Herbst, Bastian Pastewka und Kai Magnus Sting.

In der Geschichte dieses großen Landes ist es zu einem Verbrechen gekommen, das weltweit für Entsetzen sorgt. Der Eiffelturm ist geklaut worden. Sofort werden internationale Verbrechensbekämpfungsorganisationen hinzugezogen, um den Tätern auf die Spur zu kommen. Und sogar die Gurkentruppe kommt zum Einsatz: Albrecht Friedrichsberg, Jupp Straaten und Willi Dahl sind zurück und bekommen es mit einem übermächtigen Gegner zu tun, denn der Eiffelturm war nur der Anfang.
Aus dem Louvre wird die Mona Lisa entwendet und mit einem Schlag verschwindet das Originalrezept des Croissants und mit ihm das beliebte Gebäck aus sämtlichen französischen Bäckereien und Patisserien. Es herrscht Chaos und Unordnung auf der ganzen Welt, denn es verschwinden auch die spanischen Stiere, das deutsche Bier, der englische Regen, die holländischen Tulpen und sogar der italienische Stiefel…
An allen Tatorten tauchen immer wieder Visitenkarten auf, die der Übeltäter hinterlässt. 
Fantomas ist zurück! Der Genius des Bösen, der seit fast einem ganzen Jahrhundert Angst und Schrecken verbreitet. Alle Geheimdienste, Sonderermittler und Verbrechensbekämpfer bauen auf die kriminalistische Genialität der Gurkentruppe.
Wird es unseren Freunden gelingen, auch diesen fast übermächtigen Gegner zu stellen? Das Böse zu besiegen? Die Menschheit wieder aufatmen zu lassen?
Oder werden die drei einfach nur bei gutem Rotwein und Baguette in einer Brasserie enden? Was auch ein schönes Ende wäre…

Jagd auf Fantomas! Der Hörspiel - Adventskalender mit den Comedy All-Stars Annette Frier, Christoph Maria Herbst, Bastian Pastewka und Kai Magnus Sting.

Ab dem 1.12.2025 jeden Tag ein neues Comedy Krimi Abenteuer in der ARD Audiothek! 

von Kai Magnus Sting und Leonhard Koppelmann

Eine Produktion der ARD 2025
