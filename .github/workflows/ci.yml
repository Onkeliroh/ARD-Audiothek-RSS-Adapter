name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 22
          cache: maven

      - name: Run JVM tests
        run: mvn -B verify

      - name: Run native tests
        run: mvn -B -Pnative test
