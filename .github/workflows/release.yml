name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  release:
    name: Release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Check code coverage
        run: mvn -B -DskipTests jacoco:report jacoco:check

      - name: Determine release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
        
      - name: Package fat jar
        run: mvn -B -DskipTests package

      - name: Stage fat jar for release
        run: |
          mkdir -p release-assets
          cp target/ard-audiothek-rss-adapter.jar "release-assets/ard-audiothek-rss-adapter-${RELEASE_VERSION}.jar"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push with Jib
        run: |
            # Convert image name to lowercase
            IMAGE_NAME_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr 'A-Z' 'a-z')

            # Use the release tag as the main image tag (e.g., v1.0.0 -> 1.0.0)
            MAIN_TAG="${GITHUB_REF_NAME#v}"
            
            # Set additional tags (always include 'latest')
            ADDITIONAL_TAGS="latest"
            
            # Build command arguments
            TAG_ARGS="-Djib.to.tags=$ADDITIONAL_TAGS"
            
            mvn package jib:build \
              -DskipTests \
              -Djib.to.image=${IMAGE_NAME_LOWER}:$MAIN_TAG \
              $TAG_ARGS \
              -Djib.to.auth.username=${{ github.actor }} \
              -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} \
              -B
        