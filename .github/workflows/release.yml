name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  release:
    name: Release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up image name
        run: |
          echo "IMAGE_NAME=$(echo '${{ github.repository_owner }}/aara' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -v -race ./src/...

      - name: Determine release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build binaries
        run: |
          mkdir -p dist
          # Linux amd64
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o dist/ard-audiothek-rss-adapter-linux-amd64   ./src/cmd/server
          # Linux arm64
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o dist/ard-audiothek-rss-adapter-linux-arm64   ./src/cmd/server
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/ard-audiothek-rss-adapter-windows-amd64.exe ./src/cmd/server
          # macOS arm64
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o dist/ard-audiothek-rss-adapter-darwin-arm64  ./src/cmd/server
          # Rename for release
          cp dist/ard-audiothek-rss-adapter-linux-amd64 "dist/ard-audiothek-rss-adapter-${RELEASE_VERSION}-linux-amd64"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
