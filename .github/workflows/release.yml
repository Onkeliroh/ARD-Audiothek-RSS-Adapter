name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM 22
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 22
          cache: maven

      - name: Run JVM tests
        run: mvn -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: warn

      - name: Run native tests
        run: mvn -B -Pnative test

  package:
    needs: tests
    name: Build ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            artifact_suffix: windows-x64
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM 22
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 22
          cache: maven

      - name: Build JVM artifacts
        run: mvn -B -DskipTests package

      - name: Build native image
        run: mvn -B -Pnative -DskipTests package

      - name: Set project version (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set project version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME"
          if ($version.StartsWith('v')) {
            $version = $version.Substring(1)
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PROJECT_VERSION=$version"
      - name: Prepare Linux binary
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          BINARY="target/ard-audiothek-rss-adapter"
          if [ ! -f "$BINARY" ]; then
            echo "Native binary not found at $BINARY" >&2
            exit 1
          fi
          OUTPUT="ard-audiothek-rss-adapter-${PROJECT_VERSION}-linux-x64"
          cp "$BINARY" "$OUTPUT"
          chmod +x "$OUTPUT"
          echo "PACKAGE_NAME=$OUTPUT" >> "$GITHUB_ENV"

      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path -Path "target" -ChildPath "ard-audiothek-rss-adapter.exe"
          if (-not (Test-Path $binary)) {
            throw "Native binary not found at $binary"
          }
          $output = "ard-audiothek-rss-adapter-$env:PROJECT_VERSION-windows-x64.exe"
          Copy-Item -Path $binary -Destination $output -Force
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=$output"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error

  docker-image:
    name: Publish Docker image
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine image coordinates
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          VERSION="${GITHUB_REF_NAME#v}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish:
    name: Publish release
    needs:
      - package
      - docker-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Keep only distributable binaries
        run: |
          set -euo pipefail
          mkdir -p release-binaries
          shopt -s globstar nullglob
          found=false
          for file in release-assets/**/ard-audiothek-rss-adapter*; do
            cp "$file" release-binaries/
            found=true
          done
          if [ "$found" = false ]; then
            echo "No release binaries were found to publish" >&2
            exit 1
          fi
          rm -rf release-assets
          mv release-binaries release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
