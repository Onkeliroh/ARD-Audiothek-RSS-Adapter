name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        run: mvn -B clean test

      - name: Check code coverage
        run: mvn -B -DskipTests jacoco:report jacoco:check

      - name: Package fat jar
        run: mvn -B -DskipTests package

      - name: Determine release metadata
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"

      - name: Stage fat jar for release
        run: |
          mkdir -p release-assets
          cp target/ard-audiothek-rss-adapter.jar "release-assets/ard-audiothek-rss-adapter-${RELEASE_VERSION}.jar"

      - name: Build and push Docker image
        run: mvn -B -Djib.to.image=${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION} -Djib.to.tags=latest jib:build
        env:
          JIB_TO_AUTH_USERNAME: ${{ github.actor }}
          JIB_TO_AUTH_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
