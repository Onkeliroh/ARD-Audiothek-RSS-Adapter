name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  package:
    name: Build ${{ matrix.artifact_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            archive_ext: tar.gz
          - os: windows-latest
            artifact_suffix: windows-x64
            archive_ext: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up GraalVM 22
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 22
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build native image
        run: mvn -B -Pnative -DskipTests package

      - name: Read project version (Unix)
        if: runner.os != 'Windows'
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Read project version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = & mvn -q -DforceStdout help:evaluate -Dexpression=project.version
          $version = $version.Trim()
          Add-Content -Path $env:GITHUB_ENV -Value "PROJECT_VERSION=$version"
      - name: Prepare Linux binary
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          BINARY="target/native/ard-audiothek-rss-adapter"
          if [ ! -f "$BINARY" ]; then
            echo "Native binary not found at $BINARY" >&2
            exit 1
          fi
          OUTPUT="ard-audiothek-rss-adapter-${PROJECT_VERSION}-linux-x64"
          cp "$BINARY" "$OUTPUT"
          chmod +x "$OUTPUT"
          echo "PACKAGE_NAME=$OUTPUT" >> "$GITHUB_ENV"

      - name: Prepare Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path -Path "target" -ChildPath "native/ard-audiothek-rss-adapter.exe"
          if (-not (Test-Path $binary)) {
            throw "Native binary not found at $binary"
          }
          $output = "ard-audiothek-rss-adapter-$env:PROJECT_VERSION-windows-x64.exe"
          Copy-Item -Path $binary -Destination $output -Force
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=$output"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_suffix }}
          path: ${{ env.PACKAGE_NAME }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
